publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

  get: ^4.6.6

  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4

  dio: ^5.7.0
