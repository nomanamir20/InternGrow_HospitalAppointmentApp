name: interngrow_hospital_appointment_app
description: "InternGrow Internship — Hospital Appointment System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^4.0.0
  cupertino_icons: ^1.0.6
  dio: ^5.7.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  get: ^4.6.6
  google_fonts: ^8.2.1
  intl: ^0.20.3
  pdf: ^3.10.8
  printing: ^5.15.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  web: ^0.5.1
  webview_flutter: ^4.10.0
  webview_flutter_web: ^0.2.3+4

dependency_overrides:
  web: ^1.0.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon_1024.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/app_icon_1024.jpg"